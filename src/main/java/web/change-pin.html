<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change PIN - SecureBank</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#07111f;color:#eef6ff}
.nav{
height:70px;background:#0d1b2e;padding:0 7%;
display:flex;justify-content:space-between;align-items:center
}
.logo{color:#35d0ba;font-size:24px;font-weight:bold}
.nav a{color:white;text-decoration:none}
.container{width:90%;max-width:500px;margin:50px auto}
.box{
background:#0d1b2e;padding:35px;border-radius:18px;
border:1px solid rgba(255,255,255,.08)
}
h1{margin-bottom:25px}
label{display:block;color:#91a4ba;margin:15px 0 7px}
input{
width:100%;padding:14px;background:#10233a;
border:1px solid rgba(255,255,255,.1);
border-radius:9px;color:white
}
button{
width:100%;padding:14px;margin-top:25px;
background:#35d0ba;border:0;border-radius:9px;
font-weight:bold
}
.back{
display:block;text-align:center;margin-top:18px;
color:#91a4ba;text-decoration:none
}
</style>
</head>

<body>

<nav class="nav">
<div class="logo">SecureBank</div>
<a href="user-dashboard.html">Dashboard</a>
</nav>

<div class="container">

<div class="box">

<h1>🔑 Change PIN</h1>

<form onsubmit="changePin(event)">

<label>Current PIN</label>
<input type="password" maxlength="6" required>

<label>New PIN</label>
<input id="newPin" type="password" maxlength="6" required>

<label>Confirm New PIN</label>
<input id="confirmPin" type="password" maxlength="6" required>

<button>Update PIN</button>

</form>

<a href="profile.html" class="back">
← Back to Profile
</a>

</div>
</div>

<script>
function changePin(e){

e.preventDefault();

let pin=document.getElementById("newPin").value;
let confirm=document.getElementById("confirmPin").value;

if(!/^[0-9]{6}$/.test(pin)){
alert("PIN must contain exactly 6 digits.");
return;
}

if(pin!==confirm){
alert("PIN does not match!");
return;
}

alert("PIN changed successfully!");
window.location.href="profile.html";

}
</script>

</body>
</html>
