<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Withdraw Money - SecureBank</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Arial;
    background:#07111f;
    color:#eef6ff;
}

.nav{
    height:70px;
    background:#0d1b2e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
}

.logo{
    color:#35d0ba;
    font-size:24px;
    font-weight:bold
}

.nav a{
    color:white;
    text-decoration:none;
    margin-left:20px
}

.container{
    width:90%;
    max-width:550px;
    margin:50px auto
}

.box{
    background:#0d1b2e;
    padding:35px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08)
}

h1{
    margin-bottom:25px
}

label{
    display:block;
    margin:16px 0 7px;
    color:#91a4ba
}

input{
    width:100%;
    padding:14px;
    background:#10233a;
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    color:white;
    outline:none
}

input:focus{
    border-color:#35d0ba
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#35d0ba;
    font-weight:bold;
    cursor:pointer
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#91a4ba;
    text-decoration:none
}

</style>

</head>

<body>

<nav class="nav">

<div class="logo">SecureBank</div>

<a href="user-dashboard.html">Dashboard</a>

</nav>


<div class="container">

<div class="box">

<h1>💸 Withdraw Money</h1>


<form onsubmit="withdraw(event)">


<label>Amount</label>

<input id="amount"
       type="number"
       placeholder="Enter amount"
       min="1"
       required>


<label>Transaction PIN</label>

<input id="pin"
       type="password"
       maxlength="6"
       placeholder="Enter PIN"
       required>


<button type="submit">
Withdraw Money
</button>


</form>


<a href="user-dashboard.html" class="back">
← Back to Dashboard
</a>


</div>

</div>


<script>

function withdraw(event){

    event.preventDefault();

    const amount =
        document.getElementById("amount").value;

    const pin =
        document.getElementById("pin").value;

    const accountnumber =
        localStorage.getItem("accountnumber");


    if(amount <= 0){

        alert("Enter valid amount");

        return;

    }


   fetch(`http://localhost:8080/user/withdrawal?accountnumber=${accountnumber}&balance=${amount}&pin=${pin}`, {
    method: "PATCH",
    headers: {
        "Authorization": "Bearer " + localStorage.getItem("token")
    }
})


    .then(response => response.text())


    .then(data => {

        console.log("Backend response:", data);


        if(data === "0"){

            alert("Invalid PIN");

        }


        else if(data === "1"){

            alert("Insufficient balance");

        }


        else if(data === "2"){

            alert("Money withdrawn successfully!");

            window.location.href =
                "user-dashboard.html";

        }

    })


    .catch(error => {

        console.log(error);

        alert("Server Error");

    });

}

</script>


</body>

</html>
