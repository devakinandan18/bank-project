<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfer Money - SecureBank</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial;
    background:#07111f;
    color:#eef6ff;
}
.nav{
    height:70px;
    background:#0d1b2e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
}
.logo{color:#35d0ba;font-size:24px;font-weight:bold}
.nav a{color:white;text-decoration:none;margin-left:20px}
.container{width:90%;max-width:550px;margin:50px auto}
.box{
    background:#0d1b2e;
    padding:35px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.08);
}
h1{margin-bottom:25px}
label{
    display:block;
    margin:16px 0 7px;
    color:#91a4ba;
}
input{
    width:100%;
    padding:14px;
    background:#10233a;
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    color:white;
    outline:none;
}
input:focus{border-color:#35d0ba}
button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#35d0ba;
    font-weight:bold;
    cursor:pointer;
}
.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#91a4ba;
    text-decoration:none;
}
</style>
</head>

<body>

<nav class="nav">
<div class="logo">SecureBank</div>
<a href="user-dashboard.html">Dashboard</a>
</nav>

<div class="container">
<div class="box">

<h1>💸 Transfer Money</h1>

<form id="transferForm">

<label>Receiver Account Number</label>
<input id="receiverAccount" type="text"
       placeholder="Enter account number"
       required>

<label>Amount</label>
<input id="amount" type="number"
       placeholder="Enter amount"
       min="1"
       required>

<label>Transaction PIN</label>
<input id="pin" type="password"
       maxlength="6"
       placeholder="Enter PIN"
       required>

<button type="submit">Transfer Money</button>

</form>

<a class="back" href="user-dashboard.html">← Back to Dashboard</a>

</div>
</div>

<script>

document.getElementById("transferForm").addEventListener("submit", function(event){

    event.preventDefault();

    const sender = localStorage.getItem("accountnumber");
    const receiver = document.getElementById("receiverAccount").value.trim();
    const amount = document.getElementById("amount").value;
    const pin = document.getElementById("pin").value;

    if(sender === null || sender === ""){
        alert("Please login again.");
        window.location.href = "login.html";
        return;
    }

    if(receiver === ""){
        alert("Enter receiver account number");
        return;
    }

    if(sender === receiver){
        alert("Sender and receiver account cannot be same");
        return;
    }

    if(amount === "" || Number(amount) <= 0){
        alert("Enter valid amount");
        return;
    }

    if(pin === ""){
        alert("Enter transaction PIN");
        return;
    }

    console.log("Sender:", sender);
    console.log("Receiver:", receiver);
    console.log("Amount:", amount);
    console.log("PIN:", pin);

    fetch(`https://bank-project-7mle.onrender.com/user/transfermoney?accountnumbersender=${sender}&accountnumberreceiver=${receiver}&pin=${pin}&amount=${amount}`, {
    method: "PATCH",
    headers: {
        "Authorization": "Bearer " + localStorage.getItem("token")
    }
})
    .then(response => {

        if(!response.ok){
            throw new Error("HTTP Error: " + response.status);
        }

        return response.text();
    })
    .then(data => {

        console.log("Backend response:", data);

        if(data === "true"){

            alert("Money transferred successfully!");

            document.getElementById("receiverAccount").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("pin").value = "";

            window.location.href = "transactions.html";

        }else{

            alert("Transfer failed. Check receiver account, PIN or balance.");

        }

    })
    .catch(error => {

        console.log(error);
        alert("Server Error");

    });

});

</script>

</body>
</html>
