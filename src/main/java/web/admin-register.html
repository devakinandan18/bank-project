<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SecureBank - Admin Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#07111f;
    color:#eef6ff;
    min-height:100vh;
}

.navbar{
    height:70px;
    background:#0d1b2e;
    border-bottom:1px solid #1b3048;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;
}

.logo{
    color:#35d0ba;
    font-size:24px;
    font-weight:700;
}

.navbar a{
    color:#91a4ba;
    text-decoration:none;
    margin-left:25px;
}

.navbar a:hover{
    color:#35d0ba;
}

.container{
    min-height:calc(100vh - 70px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.register-box{
    width:100%;
    max-width:500px;

    background:#0d1b2e;

    border:1px solid #1b3048;
    border-radius:20px;

    padding:35px;

    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.icon{
    text-align:center;
    font-size:42px;
}

h1{
    text-align:center;
    margin-top:10px;
}

.subtitle{
    text-align:center;
    color:#91a4ba;
    margin:8px 0 30px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;
    color:#91a4ba;
    font-size:14px;
    margin-bottom:8px;
}

input{
    width:100%;

    padding:13px;

    background:#10233a;

    border:1px solid #263d58;
    border-radius:9px;

    color:#eef6ff;

    outline:none;
}

input:focus{
    border-color:#35d0ba;
}

.register-btn{
    width:100%;

    padding:14px;

    border:0;
    border-radius:10px;

    background:#35d0ba;
    color:#07111f;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.register-btn:hover{
    transform:translateY(-2px);
}

.login-link{
    text-align:center;

    margin-top:22px;

    color:#91a4ba;
    font-size:14px;
}

.login-link a{
    color:#35d0ba;
    text-decoration:none;
}

.warning{
    margin-top:18px;

    padding:12px;

    border-radius:8px;

    background:#10233a;

    color:#91a4ba;

    font-size:12px;
}

</style>

</head>

<body>


<nav class="navbar">

    <div class="logo">
        🏦 SecureBank
    </div>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="admin-login.html">
            Admin Login
        </a>

    </div>

</nav>


<div class="container">

    <div class="register-box">

        <div class="icon">
            🛡️
        </div>

        <h1>Admin Registration</h1>

        <p class="subtitle">
            Create a SecureBank administrator account
        </p>


        <div class="field">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter admin name">

        </div>


        <div class="field">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit mobile number">

        </div>


        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password">

        </div>


        <div class="field">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password">

        </div>
         <div class="field">

                <label>Email id</label>

                <input
                    type="email"
                    id="email"
                   
                    placeholder="Email">

            </div>


        <button
            class="register-btn"
            onclick="registerAdmin()">

            🛡️ Create Admin Account

        </button>


        <div class="warning">
            ⚠️ Admin registration should normally be restricted
            to authorized personnel.
        </div>


        <div class="login-link">

            Already have an admin account?

            <a href="admin-login.html">
                Login here
            </a>

        </div>

    </div>

</div>


<script>

function registerAdmin(){

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(name === ""){

        alert("Please enter admin name.");
        return;

    }


    if(!/^[0-9]{10}$/.test(mobile)){

        alert(
            "Please enter valid 10-digit mobile number."
        );

        return;

    }


    if(password.length < 6){

        alert(
            "Password must contain at least 6 characters."
        );

        return;

    }


    if(password !== confirmPassword){

        alert(
            "Passwords do not match."
        );

        return;

    }
    const email =
    document.getElementById("email").value.trim();
    if(email === ""){
        alert("Please enter email.");
        return;
    }
    const admin = {
        adminname: name,
        email:email,
        mobilenumber: mobile,
        password: password
        
    };
      fetch("https://bank-project-7mle.onrender.com/admin",{
        "method":"POST",
        "headers":{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(admin)
    })
    .then(response=>response.json())
    .then(data=>{
        if(data){
            alert("register successful");
            window.location.href="admin-login.html";
        }
        else
        {
            alert("user already exist");
        }
    })
    .catch(error=>{
        console.error(error);
        alert("server alert");
    })

    // alert(
    //     "Admin registration successful!"
    // );


    // window.location.href =
    //     "admin-login.html";

}

</script>

</body>
</html>
